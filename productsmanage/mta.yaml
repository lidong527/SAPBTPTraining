_schema-version: 3.3.0
ID: productsmanage
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install
        - npx cds build --production
modules:
  - name: productsmanage-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: productsmanage-auth
      # - name: productsmanage-db
      # - name: productsmanage-redis
      - name: productsmanage-connectivity
      - name: productsmanage-destination
      - name: productsmanage-logging
      # - name: productsmanage-auditlog

  - name: productsmanage-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    # requires:
    #   - name: productsmanage-db
  - name: productsmanage
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: productsmanage-auth
      - name: productsmanage-destination
      - name: productsmanage-html5-runtime
      # - name: productsmanage-portal
      - name: productsmanage-logging
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

  - name: productsmanage-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: productsmanageadminauthors
          artifacts:
            - admin-authors.zip
          target-path: app/
        - name: productsmanageadminbooks
          artifacts:
            - admin-books.zip
          target-path: app/
        - name: productsmanagebrowse
          artifacts:
            - browse.zip
          target-path: app/
        - name: productsmanagegenres
          artifacts:
            - genres.zip
          target-path: app/
    requires:
      - name: productsmanage-auth
      - name: srv-api
      - name: productsmanage-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true

  - name: productsmanageadminauthors
    type: html5
    path: app/admin-authors
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build
      supported-platforms:
        []
  - name: productsmanageadminbooks
    type: html5
    path: app/admin-books
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build
      supported-platforms:
        []
  - name: productsmanagebrowse
    type: html5
    path: app/browse
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build
      supported-platforms:
        []
  - name: productsmanagegenres
    type: html5
    path: app/genres
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build
      supported-platforms:
        []

  - name: productsmanage-portal-deployer
    type: com.sap.application.content
    path: app/portal
    requires:
      # - name: productsmanage-portal
      #   parameters:
      #     content-target: true
      #     service-key:
      #       name: productsmanage-portal-key
      #       config:
      #         content-endpoint: developer
      - name: productsmanage-auth
      - name: productsmanage-html5-repo-host
      - name: productsmanage-app-deployer
    deployed-after:
      - productsmanage-app-deployer
  - name: notification-content-deployment
    type: nodejs
    path: gen/srv
    parameters:
      no-route: true
      no-start: true
      memory: 256MB
      disk-quota: 1GB
      tasks:
        - name: notification-content-deployment
          command: "node node_modules/@cap-js/notifications/lib/content-deployment.js"
          memory: 256MB
          disk-quota: 1GB
    requires:
      - name: productsmanage-destination

resources:
  - name: productsmanage-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: productsmanage-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
        role-collections:
          - name: 'admin (productsmanage ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.admin'
    requires:
      - name: app-api
  # - name: productsmanage-db
  #   type: com.sap.xs.hdi-container
  #   parameters:
  #     service: hana
  #     service-plan: hdi-shared
  # - name: productsmanage-redis
  #   type: org.cloudfoundry.managed-service
  #   parameters:
  #     service: redis-cache
  #     service-plan: trial
      # config:
      # memory: 2 # GB, can be 2 or 4
      # multi_az: true
      # cluster_mode: true
      # shard_count: 1
      # node_count: 3 # per shard minimum is 3 (for standard plan)
      # engine_version: "6.0" # can be "4.0" or "6.0"
      # maintenance_window:
      # day_of_week: Friday
      # start_hour_utc: 0
      # duration: 5 # hours
  - name: productsmanage-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite
  - name: productsmanage-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: productsmanage-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: productsmanage-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
  # - name: productsmanage-portal
  #   type: org.cloudfoundry.managed-service
  #   parameters:
  #     service: portal
  #     service-plan: standard
  - name: productsmanage-logging
    type: org.cloudfoundry.managed-service
    parameters:
      service: application-logs
      service-plan: lite
